<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <!-- Karaka brand banner — same navy→teal gradient and floating-icon language
       as the suite login hero panel (opal-suite/login-v2). Self-contained SVG,
       no external fonts/images. Use as a header/social banner or drop inline
       wherever the suite needs a full brand lockup rather than just the mark. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="0.45" stop-color="#122A4A"/>
      <stop offset="0.78" stop-color="#0F4A50"/>
      <stop offset="1" stop-color="#0F8B8D"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2451FF"/>
      <stop offset="1" stop-color="#0F8B8D"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 90) scale(360)">
      <stop offset="0" stop-color="#5B82FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B82FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 300) scale(320)">
      <stop offset="0" stop-color="#2DD4C6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2DD4C6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glowA)"/>
  <rect width="1200" height="360" fill="url(#glowB)"/>

  <!-- faint floating suite-domain glyphs (doc / chart / shield), same set as
       the login hero — kept low-opacity so they read as texture, not clutter -->
  <g stroke="rgba(255,255,255,.12)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M980 70h34l17 17v44h-51z M1014 70v17h17" transform="scale(.9)" />
    <path d="M700 300h54 M712 300v-24 M730 300v-40 M748 300v-16" />
    <path d="M1080 210l27 10v20c0 18-11 30-27 37-16-7-27-19-27-37v-20z" transform="scale(.8) translate(230 20)"/>
  </g>

  <!-- mark: three nodes converging — Karaka, "the agent that brings the
       action about," the point everything else relates back to -->
  <g transform="translate(90 120)">
    <path d="M0 96 L60 0 L120 96" stroke="url(#markGrad)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="96" r="17" fill="url(#markGrad)"/>
    <circle cx="120" cy="96" r="17" fill="url(#markGrad)"/>
    <circle cx="60" cy="0" r="17" fill="url(#markGrad)"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="260" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="84" letter-spacing="-1" fill="#FFFFFF">KARAKA</text>
  <text x="262" y="228" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="22" letter-spacing="0.5" fill="#5FE0D2">Workforce, unified.</text>
  <text x="262" y="262" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="17" fill="#AFC1DB">ORBIT · AURA · PULSE — one login, one system of record.</text>
</svg>
