# Render blueprint for Karaka.
#
# Two Docker web services. Postgres is deliberately NOT declared here — see the note
# on the database below.
#
# Before first deploy, create the environment group and fill in the secrets:
#   openssl rand -base64 32   # once per secret
#
# Free-tier realities to know before you rely on this:
#   - free web services sleep after ~15 minutes idle and cold-start in ~50s. Both
#     services sleeping means the first request after a quiet period is slow; the
#     service entrypoint waits for Keycloak rather than crash-looping.
#   - the ORBIT store is in memory, so its data resets on every restart and every
#     wake. Persisting it needs the JPA work, not a config change.

services:
  # ---- Keycloak: identity provider -----------------------------------------
  - type: web
    name: karaka-keycloak
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: .
    healthCheckPath: /realms/karaka/.well-known/openid-configuration
    envVars:
      - fromGroup: karaka-secrets
      # Public URL of THIS service. Keycloak builds redirect and issuer URLs from it,
      # and gets them wrong if it is unset behind a TLS-terminating proxy.
      - key: KC_HOSTNAME
        value: https://karaka-keycloak.onrender.com
      # Connection details come from whichever managed Postgres you chose.
      - key: KC_DB_URL
        sync: false
      - key: KC_DB_USERNAME
        sync: false
      - key: KC_DB_PASSWORD
        sync: false
      # Seeds the admin on first boot only. Remove this variable afterwards: leaving a
      # bootstrap admin password in the environment of a running service is a standing
      # credential nobody is rotating.
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # ---- Karaka service: BFF + ORBIT API -------------------------------------
  - type: web
    name: karaka
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: karaka-secrets
      - key: KEYCLOAK_ISSUER_URI
        value: https://karaka-keycloak.onrender.com/realms/karaka
      # The session cookie must be Secure once traffic is HTTPS, or a browser will
      # refuse to send it and every login silently fails to stick.
      - key: KARAKA_COOKIE_SECURE
        value: "true"
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework

# Shared secrets. Defined once because the client secret must be byte-identical on
# both services — Keycloak stores it, the service presents it. Diverging values fail
# with invalid_client, which reads like a config typo rather than a mismatch.
envVarGroups:
  - name: karaka-secrets
    envVars:
      # Keycloak substitutes these into the realm; the service reads
      # KEYCLOAK_CLIENT_SECRET. KARAKA_WEB_SECRET and KEYCLOAK_CLIENT_SECRET must hold
      # the same value.
      - key: KARAKA_WEB_SECRET
        sync: false
      - key: KARAKA_API_SECRET
        sync: false
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      # Public URL of the application, used for redirect and post-logout URIs.
      - key: APP_BASE_URL
        value: https://karaka.onrender.com

# ---- Database -------------------------------------------------------------
# Not declared as a Render resource on purpose: Render's free Postgres is deleted
# after 30 days, and it holds every Keycloak user, credential and session. Use a
# managed free tier that does not expire (Neon, Supabase) and set KC_DB_URL,
# KC_DB_USERNAME and KC_DB_PASSWORD above from it.
#
# The realm itself is declarative and re-imports from the template, but anything
# created after that — a user added in the console, a rotated password — exists only
# in the database.
