# Karaka message overrides. Only keys that differ from Keycloak's base bundle belong here;
# everything else falls through to base, so this file stays readable.

# --- Forgot password ---------------------------------------------------------------------
# Keycloak answers identically whether or not the account exists, on purpose: a different
# reply for an unknown user turns this form into a username-enumeration oracle, letting
# anyone confirm which employees have accounts. That property is worth keeping, but the
# stock wording ("You should receive an email shortly") leaves someone who mistyped their
# username waiting for mail that was never sent, with no idea why.
#
# So: keep the ambiguity, drop the false certainty, and say what to do when nothing arrives.
# Accounts here are created by an administrator (registrationAllowed=false), so there is no
# self-service signup to send anyone to.
emailSentMessage=If an account exists for that username or email, we have sent it instructions. Nothing arrived? Check spam, confirm the spelling, and remember Karaka accounts are created by your workspace admin.
emailInstruction=Enter the username or email on your Karaka account and we will send a link to set a new password.
