# Karaka login theme.
#
# parent=base gives us the FreeMarker context (msg/url/realm/messagesPerField)
# and i18n message bundles WITHOUT inheriting Keycloak's default markup or
# PatternFly CSS — login.ftl here is standalone, so nothing has to be
# overridden back out. Do not switch this to parent=keycloak: you would then
# be fighting kc-* styles instead of writing your own.
parent=base
locales=en
styles=css/karaka.css
